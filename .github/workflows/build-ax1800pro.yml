name: Build iStoreOS for JDCloud AX1800 Pro

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'iStoreOS branch'
        required: true
        default: 'istoreos-24.10'
        type: choice
        options:
          - istoreos-24.10
          - istoreos-22.03

env:
  REPO_URL: https://github.com/istoreos/istoreos
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_SCRIPT: diy-script.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
        libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
        libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
        python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
        uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b ${{ github.event.inputs.branch }} openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 检查目标平台支持
      run: |
        cd openwrt
        if [ ! -d "target/linux/ipq60xx" ]; then
          echo "⚠️ iStoreOS 不支持 ipq60xx，尝试添加支持..."
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b openwrt-23.05 /tmp/openwrt-official
          if [ -d "/tmp/openwrt-official/target/linux/ipq60xx" ]; then
            cp -r /tmp/openwrt-official/target/linux/ipq60xx target/linux/
            echo "✓ 已从官方 OpenWrt 复制 ipq60xx 支持"
          else
            echo "❌ 官方 OpenWrt 也不支持 ipq60xx，尝试 ImmortalWrt..."
            git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git -b openwrt-23.05 /tmp/immortalwrt
            if [ -d "/tmp/immortalwrt/target/linux/ipq60xx" ]; then
              cp -r /tmp/immortalwrt/target/linux/ipq60xx target/linux/
              echo "✓ 已从 ImmortalWrt 复制 ipq60xx 支持"
            fi
          fi
        fi
        ls -la target/linux/ | grep ipq

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 生成配置文件
      run: |
        cd openwrt
        
        # 检查是否支持 ipq60xx
        if [ -d "target/linux/ipq60xx" ]; then
          echo "✓ 使用 ipq60xx 配置"
          cat > .config <<EOF
CONFIG_TARGET_ipq60xx=y
CONFIG_TARGET_ipq60xx_generic=y
CONFIG_TARGET_ipq60xx_generic_DEVICE_jdcloud_ax1800-pro=y
EOF
        elif [ -d "target/linux/qualcommax" ]; then
          echo "⚠️ 使用 qualcommax 配置（ipq6018 可能在此）"
          cat > .config <<EOF
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
EOF
        else
          echo "❌ 未找到支持的目标平台"
          echo "可用平台："
          ls -1 target/linux/
          exit 1
        fi
        
        # 添加 iStoreOS 特色应用
        cat >> .config <<EOF
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl-openssl=y
CONFIG_PACKAGE_luci-app-store=y
CONFIG_PACKAGE_luci-app-quickstart=y
CONFIG_PACKAGE_luci-app-istorex=y
CONFIG_PACKAGE_luci-app-diskman=y
CONFIG_PACKAGE_luci-app-samba4=y
CONFIG_PACKAGE_luci-app-aria2=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_luci-app-turboacc=y
CONFIG_PACKAGE_luci-app-firewall=y
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_wget-ssl=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_nano=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-fs-ext4=y
EOF

    - name: 下载编译依赖
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件到 artifact
      uses: actions/upload-artifact@v3
      with:
        name: iStoreOS_AX1800Pro${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成 release 标签
      id: tag
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "release_tag=iStoreOS_AX1800Pro_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到 release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          ## iStoreOS for JDCloud AX1800 Pro (实验性)
          
          **设备**: 京东云 AX1800 Pro (Arthur)
          **芯片**: Qualcomm IPQ6018
          **分支**: ${{ github.event.inputs.branch }}
          **编译时间**: ${{ env.FILE_DATE }}
          
          ⚠️ **警告**: 这是实验性固件，iStoreOS 官方不支持此设备
          - 刷机有风险，请做好备份
          - 建议保留原厂固件以便恢复
          - 部分功能可能无法正常工作
          
          **刷机方法**:
          1. 进入 Breed/U-Boot 刷机模式
          2. 上传 factory.bin 文件
          3. 等待重启完成

    - name: 清理旧的 releases
      uses: dev-drprasad/delete-older-releases@v0.2.1
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
